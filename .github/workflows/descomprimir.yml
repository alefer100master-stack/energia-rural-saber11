# Descomprime en la raíz del repositorio los archivos subir_*.zip que se suban por la web
# y luego los borra, para que el repositorio quede con la estructura de carpetas de la guía CUN.
name: Descomprimir zips subidos

on:
  push:
    paths:
      - "subir_*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: descomprimir
  cancel-in-progress: false

jobs:
  descomprimir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Descomprimir y borrar los zips
        run: |
          git pull --rebase origin main
          shopt -s nullglob
          zips=(subir_*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No hay zips por descomprimir"; exit 0; fi
          for z in "${zips[@]}"; do
            echo "Descomprimiendo $z"
            unzip -o "$z" -d .
            git rm -q "$z"
          done

      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir archivos subidos (zip)" || exit 0
          git push origin HEAD:main
